<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>いわくに文化財マップ</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f7f7f7;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* 左サイドバー */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: #ffffff;
      border-right: 1px solid #ddd;
      padding: 18px 16px;
      overflow-y: auto;
      box-shadow: 2px 0 8px rgba(0,0,0,0.08);
      z-index: 1000;
    }

    .sidebar h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .section {
      margin-bottom: 24px;
    }

    .section-title {
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 8px;
      padding-bottom: 5px;
      border-bottom: 1px solid #ddd;
    }

    .filter-item,
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 7px 0;
      font-size: 0.92rem;
    }

    .filter-item {
      cursor: pointer;
    }

    .filter-item input {
      cursor: pointer;
    }

    .legend-symbol {
      width: 22px;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .legend-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #999;
      flex-shrink: 0;
    }

    .button-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      border: 1px solid #bbb;
      background: #fff;
      border-radius: 5px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    button:hover {
      background: #f0f0f0;
    }

    /* 地図 */
    #map {
      flex: 1;
      height: 100vh;
    }

    .popup-title {
      font-weight: bold;
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .popup-row {
      margin-top: 4px;
    }

    .special-marker {
      background: transparent;
      border: none;
    }

    .special-symbol {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      line-height: 28px;

      text-shadow:
        -1px -1px 0 #fff,
         1px -1px 0 #fff,
        -1px  1px 0 #fff,
         1px  1px 0 #fff;
    }

    /* スマホ */
    @media (max-width: 700px) {

      .sidebar {
        width: 210px;
        min-width: 210px;
        padding: 14px 12px;
      }

      .sidebar h1 {
        font-size: 1.1rem;
      }

    }
  </style>
</head>

<body>

<div class="app">

  <!-- 左ナビ -->
  <aside class="sidebar">

    <h1>いわくに文化財マップ</h1>

    <div class="subtitle">
      岩国の文化財を<br>
      地図から見てみよう
    </div>


    <div class="section">

      <div class="section-title">
        表示する文化財
      </div>

      <label class="filter-item">
        <input
          type="checkbox"
          data-layer="nationalTreasure"
          checked
        >
        <span style="color:#d73027;font-weight:bold;">★</span>
        国宝
      </label>

      <label class="filter-item">
        <input
          type="checkbox"
          data-layer="important"
          checked
        >
        <span style="color:#f39c12;font-weight:bold;">◆</span>
        重要文化財
      </label>

      <label class="filter-item">
        <input
          type="checkbox"
          data-layer="prefecture"
          checked
        >
        <span
          class="legend-dot"
          style="background:#1a9850"
        ></span>
        県指定
      </label>

      <label class="filter-item">
        <input
          type="checkbox"
          data-layer="city"
          checked
        >
        <span
          class="legend-dot"
          style="background:#3388ff"
        ></span>
        市指定
      </label>

      <label class="filter-item">
        <input
          type="checkbox"
          data-layer="other"
          checked
        >
        <span
          class="legend-dot"
          style="background:#984ea3"
        ></span>
        その他
      </label>


      <div class="button-row">

        <button id="showAll">
          全て表示
        </button>

        <button id="showMajor">
          国宝・重要のみ
        </button>

      </div>

    </div>


    <div class="section">

      <div class="section-title">
        凡例
      </div>

      <div class="legend-item">
        <span
          class="legend-symbol"
          style="color:#d73027"
        >
          ★
        </span>
        国宝
      </div>

      <div class="legend-item">
        <span
          class="legend-symbol"
          style="color:#f39c12"
        >
          ◆
        </span>
        重要文化財
      </div>

      <div class="legend-item">
        <span
          class="legend-dot"
          style="background:#1a9850"
        ></span>
        県指定
      </div>

      <div class="legend-item">
        <span
          class="legend-dot"
          style="background:#3388ff"
        ></span>
        市指定
      </div>

      <div class="legend-item">
        <span
          class="legend-dot"
          style="background:#984ea3"
        ></span>
        その他
      </div>

    </div>

  </aside>


  <!-- 地図 -->
  <div id="map"></div>

</div>


<script>

  const map =
    L.map('map').setView(
      [34.16, 132.22],
      11
    );


  L.tileLayer(
    'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
    {
      attribution: '地図：国土地理院'
    }
  ).addTo(map);


  function getCategoryGroup(category) {

    category =
      String(category || '');

    if (
      category.includes('国宝')
    ) {
      return 'nationalTreasure';

    } else if (
      category.includes('重要文化財')
    ) {
      return 'important';

    } else if (
      category.includes('県指定')
    ) {
      return 'prefecture';

    } else if (
      category.includes('市指定')
    ) {
      return 'city';

    }

    return 'other';
  }


  const layers = {

    nationalTreasure:
      L.layerGroup().addTo(map),

    important:
      L.layerGroup().addTo(map),

    prefecture:
      L.layerGroup().addTo(map),

    city:
      L.layerGroup().addTo(map),

    other:
      L.layerGroup().addTo(map)

  };


  function createMarker(
    feature,
    latlng
  ) {

    const p =
      feature.properties || {};

    const category =
      p['文化財分類'] || '';

    const group =
      getCategoryGroup(category);


    if (
      group === 'nationalTreasure'
    ) {

      const icon =
        L.divIcon({

          className:
            'special-marker',

          html: `
            <div
              class="special-symbol"
              style="color:#d73027"
            >
              ★
            </div>
          `,

          iconSize: [28, 28],

          iconAnchor: [14, 14]

        });

      return L.marker(
        latlng,
        { icon }
      );
    }


    if (
      group === 'important'
    ) {

      const icon =
        L.divIcon({

          className:
            'special-marker',

          html: `
            <div
              class="special-symbol"
              style="color:#f39c12"
            >
              ◆
            </div>
          `,

          iconSize: [28, 28],

          iconAnchor: [14, 14]

        });

      return L.marker(
        latlng,
        { icon }
      );
    }


    let color = '#984ea3';

    if (
      group === 'prefecture'
    ) {
      color = '#1a9850';

    } else if (
      group === 'city'
    ) {
      color = '#3388ff';
    }


    return L.circleMarker(
      latlng,
      {
        radius: 8,
        color: '#ffffff',
        weight: 2,
        fillColor: color,
        fillOpacity: 0.9
      }
    );
  }


  fetch('./mapdata.geojson')

    .then(response => {

      if (!response.ok) {
        throw new Error(
          'GeoJSONの読み込みに失敗しました'
        );
      }

      return response.json();

    })

    .then(data => {

      const bounds = [];


      data.features.forEach(
        feature => {

          if (
            !feature.geometry ||
            feature.geometry.type !== 'Point'
          ) {
            return;
          }


          const [lon, lat] =
            feature.geometry.coordinates;


          const latlng =
            L.latLng(
              lat,
              lon
            );


          const marker =
            createMarker(
              feature,
              latlng
            );


          const p =
            feature.properties || {};


          const name =
            p.name ||
            '名称不明';


          const category =
            p['文化財分類'] ||
            '';


          const lines = [];


          lines.push(
            `
            <div class="popup-title">
              ${escapeHtml(name)}
            </div>
            `
          );


          if (category) {

            lines.push(
              `
              <div class="popup-row">
                文化財分類：
                ${escapeHtml(category)}
              </div>
              `
            );

          }


          if (p.address) {

            lines.push(
              `
              <div class="popup-row">
                住所：
                ${escapeHtml(
                  p.address
                )}
              </div>
              `
            );

          }


          if (p.description) {

            lines.push(
              `
              <div class="popup-row">
                ${escapeHtml(
                  p.description
                )}
              </div>
              `
            );

          }


          marker.bindPopup(
            lines.join('')
          );


          const group =
            getCategoryGroup(
              category
            );


          marker.addTo(
            layers[group]
          );


          bounds.push(
            latlng
          );

        }
      );


      if (
        bounds.length > 0
      ) {

        map.fitBounds(
          bounds,
          {
            padding:
              [30, 30]
          }
        );

      }

    })

    .catch(error => {

      console.error(error);

      alert(
        '文化財データを読み込めませんでした。'
      );

    });


  // ------------------------------------------------
  // チェックボックス
  // ------------------------------------------------

  document
    .querySelectorAll(
      'input[data-layer]'
    )
    .forEach(input => {

      input.addEventListener(
        'change',
        event => {

          const layerName =
            event.target
              .dataset.layer;


          const layer =
            layers[layerName];


          if (
            event.target.checked
          ) {

            map.addLayer(layer);

          } else {

            map.removeLayer(layer);

          }

        }
      );

    });


  // ------------------------------------------------
  // 全て表示
  // ------------------------------------------------

  document
    .getElementById('showAll')
    .addEventListener(
      'click',
      () => {

        document
          .querySelectorAll(
            'input[data-layer]'
          )
          .forEach(input => {

            input.checked = true;

            map.addLayer(
              layers[
                input.dataset.layer
              ]
            );

          });

      }
    );


  // ------------------------------------------------
  // 国宝・重要文化財だけ
  // ------------------------------------------------

  document
    .getElementById('showMajor')
    .addEventListener(
      'click',
      () => {

        document
          .querySelectorAll(
            'input[data-layer]'
          )
          .forEach(input => {

            const name =
              input.dataset.layer;


            const show =
              name ===
                'nationalTreasure'
              ||
              name ===
                'important';


            input.checked =
              show;


            if (show) {

              map.addLayer(
                layers[name]
              );

            } else {

              map.removeLayer(
                layers[name]
              );

            }

          });

      }
    );


  function escapeHtml(value) {

    return String(value)

      .replaceAll(
        '&',
        '&amp;'
      )

      .replaceAll(
        '<',
        '&lt;'
      )

      .replaceAll(
        '>',
        '&gt;'
      )

      .replaceAll(
        '"',
        '&quot;'
      )

      .replaceAll(
        "'",
        '&#039;'
      );
  }

</script>

</body>
</html>

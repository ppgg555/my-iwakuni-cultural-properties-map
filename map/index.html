<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>いわくに文化財マップ</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  body {
    margin: 0;
    font-family: sans-serif;
  }

  h1 {
    margin: 16px;
    font-size: 1.4rem;
  }

  #map {
    height: calc(100vh - 70px);
  }
</style>
</head>

<body>

<h1>いわくに文化財マップ</h1>
<div id="map"></div>

<script>

// 初期位置
const map = L.map('map').setView([34.16, 132.22], 12);


// 国土地理院「淡色地図」
L.tileLayer(
  'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
  {
    attribution: '国土地理院'
  }
).addTo(map);


// 文化財分類ごとの色
function getMarkerColor(category) {

  if (!category) {
    return 'blue';
  }

  category = String(category);

  if (category.includes('国宝')) {
    return 'red';

  } else if (category.includes('重要文化財')) {
    return 'orange';

  } else if (category.includes('県指定')) {
    return 'green';

  } else if (category.includes('市指定')) {
    return 'blue';

  } else {
    return 'purple';
  }
}


// GeoJSON読み込み
fetch('./mapdata.geojson')
  .then(response => response.json())
  .then(data => {

    const layer = L.geoJSON(data, {

      // GeoJSONのPointを色付きマーカーにする
      pointToLayer: (feature, latlng) => {

        const p = feature.properties || {};
        const category = p['文化財分類'] || '';

        return L.marker(latlng, {
          icon: L.icon({
            iconUrl:
              `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${getMarkerColor(category)}.png`,

            shadowUrl:
              'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',

            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
          })
        });
      },


      // ポップアップ
      onEachFeature: (feature, marker) => {

        const p = feature.properties || {};

        const name = p.name || '名称不明';
        const category = p['文化財分類'] || '';

        const lines = [];

        lines.push(`<strong>${name}</strong>`);

        if (category) {
          lines.push(`文化財分類：${category}`);
        }

        if (p.address) {
          lines.push(`住所：${p.address}`);
        }

        if (p.description) {
          lines.push(p.description);
        }

        marker.bindPopup(lines.join('<br>'));
      }

    }).addTo(map);


    // 全文化財が見える範囲へ自動調整
    if (layer.getBounds().isValid()) {
      map.fitBounds(
        layer.getBounds(),
        {
          padding: [20, 20]
        }
      );
    }

  });

</script>

</body>
</html>

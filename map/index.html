<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>いわくに文化財マップ</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
      overflow: hidden;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* =========================
       サイドバー
       ========================= */

    .sidebar {
      width: 270px;
      min-width: 270px;
      height: 100%;
      background: #fff;
      border-right: 1px solid #ddd;
      padding: 18px 16px;
      overflow-y: auto;
      box-shadow: 2px 0 8px rgba(0,0,0,0.08);
      z-index: 2000;
    }

    .sidebar h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .section {
      margin-bottom: 24px;
    }

    .section-title {
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 8px;
      padding-bottom: 5px;
      border-bottom: 1px solid #ddd;
    }

    .filter-item,
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 9px 0;
      font-size: 0.92rem;
    }

    .filter-item {
      cursor: pointer;
    }

    .filter-item input {
      cursor: pointer;
    }

    .legend-symbol {
      width: 22px;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .legend-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #999;
      flex-shrink: 0;
    }

    /* =========================
       検索
       ========================= */

    .search-box {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #bbb;
      border-radius: 7px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-box:focus {
      border-color: #666;
    }

    .search-info {
      margin-top: 6px;
      font-size: 0.78rem;
      color: #777;
    }

    /* =========================
       ボタン
       ========================= */

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button {
      border: 1px solid #bbb;
      background: #fff;
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    button:hover {
      background: #f0f0f0;
    }

    /* =========================
       地図
       ========================= */

    #map {
      flex: 1;
      height: 100%;
      min-width: 0;
    }

    /* =========================
       ポップアップ
       ========================= */

    .popup-title {
      font-weight: bold;
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .popup-row {
      margin-top: 4px;
    }

    /* =========================
       特殊マーカー
       ========================= */

    .special-marker {
      background: transparent;
      border: none;
    }

    .special-symbol {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      line-height: 28px;

      text-shadow:
        -1px -1px 0 #fff,
         1px -1px 0 #fff,
        -1px  1px 0 #fff,
         1px  1px 0 #fff;
    }

    /* =========================
       スマホ用メニューボタン
       ========================= */

    .menu-button {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 3000;

      width: 46px;
      height: 46px;

      border: none;
      border-radius: 10px;

      background: rgba(255,255,255,0.96);

      box-shadow:
        0 2px 8px rgba(0,0,0,0.25);

      font-size: 24px;
      line-height: 1;

      cursor: pointer;
    }

    .sidebar-overlay {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(0,0,0,0.35);

      z-index: 1900;
    }

    /* =========================
       スマホ
       ========================= */

    @media (max-width: 768px) {

      .app {
        display: block;
      }

      #map {
        width: 100%;
        height: 100%;
      }

      .sidebar {
        position: fixed;

        top: 0;
        left: 0;

        width: min(84vw, 330px);
        min-width: 0;

        height: 100%;

        transform: translateX(-100%);
        transition: transform 0.25s ease;

        box-shadow:
          4px 0 14px rgba(0,0,0,0.25);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .menu-button {
        display: block;
      }

      .sidebar-overlay.show {
        display: block;
      }

      .sidebar h1 {
        padding-right: 30px;
        font-size: 1.2rem;
      }

      .filter-item,
      .legend-item {
        font-size: 1rem;
        margin: 11px 0;
      }

      button {
        padding: 9px 12px;
        font-size: 0.9rem;
      }

      .leaflet-top.leaflet-left {
        top: 62px;
      }
    }

    @media (max-width: 420px) {
      .sidebar {
        width: 90vw;
        padding: 16px 14px;
      }

      .subtitle {
        font-size: 0.8rem;
      }
    }
  </style>
</head>

<body>

<button
  id="menuButton"
  class="menu-button"
  aria-label="メニューを開く"
>
  ☰
</button>

<div
  id="sidebarOverlay"
  class="sidebar-overlay"
></div>

<div class="app">

  <aside
    id="sidebar"
    class="sidebar"
  >

    <h1>いわくに文化財マップ</h1>

    <div class="subtitle">
      岩国の文化財を<br>
      地図から見てみよう
    </div>

    <!-- 名称検索 -->
    <div class="section">

      <div class="section-title">
        名称で検索
      </div>

      <input
        id="nameSearch"
        class="search-box"
        type="search"
        placeholder="例：錦帯橋、神社、寺..."
      >

      <div
        id="searchInfo"
        class="search-info"
      >
        名称の一部を入力してください
      </div>

    </div>

    <!-- カテゴリ -->
    <div class="section">

      <div class="section-title">
        表示する文化財
      </div>

      <label class="filter-item">
        <input
          type="checkbox"
          data-layer="nationalTreasure"
          checked
        >
        <span style="color:#d73027;font-weight:bold;">★</span>
        国宝
      </label>

      <label class="filter-item">
        <input
          type="checkbox"
          data-layer="important"
          checked
        >
        <span style="color:#f39c12;font-weight:bold;">◆</span>
        重要文化財
      </label>

      <label class="filter-item">
        <input
          type="checkbox"
          data-layer="prefecture"
          checked
        >
        <span
          class="legend-dot"
          style="background:#1a9850"
        ></span>
        県指定
      </label>

      <label class="filter-item">
        <input
          type="checkbox"
          data-layer="city"
          checked
        >
        <span
          class="legend-dot"
          style="background:#3388ff"
        ></span>
        市指定
      </label>

      <label class="filter-item">
        <input
          type="checkbox"
          data-layer="other"
          checked
        >
        <span
          class="legend-dot"
          style="background:#984ea3"
        ></span>
        その他
      </label>

      <div class="button-row">

        <button id="showAll">
          全て表示
        </button>

        <button id="showMajor">
          国宝・重要のみ
        </button>

      </div>

    </div>

    <!-- 凡例 -->
    <div class="section">

      <div class="section-title">
        凡例
      </div>

      <div class="legend-item">
        <span
          class="legend-symbol"
          style="color:#d73027"
        >
          ★
        </span>
        国宝
      </div>

      <div class="legend-item">
        <span
          class="legend-symbol"
          style="color:#f39c12"
        >
          ◆
        </span>
        重要文化財
      </div>

      <div class="legend-item">
        <span
          class="legend-dot"
          style="background:#1a9850"
        ></span>
        県指定
      </div>

      <div class="legend-item">
        <span
          class="legend-dot"
          style="background:#3388ff"
        ></span>
        市指定
      </div>

      <div class="legend-item">
        <span
          class="legend-dot"
          style="background:#984ea3"
        ></span>
        その他
      </div>

    </div>

  </aside>

  <div id="map"></div>

</div>

<script>

  // =========================================
  // 地図
  // =========================================

  const map =
    L.map('map').setView(
      [34.16, 132.22],
      11
    );

  L.tileLayer(
    'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
    {
      attribution: '地図：国土地理院'
    }
  ).addTo(map);


  // =========================================
  // 分類
  // =========================================

  function getCategoryGroup(category) {

    category =
      String(category || '');

    if (
      category.includes('国宝')
    ) {
      return 'nationalTreasure';
    }

    if (
      category.includes('重要文化財')
    ) {
      return 'important';
    }

    if (
      category.includes('県指定')
    ) {
      return 'prefecture';
    }

    if (
      category.includes('市指定')
    ) {
      return 'city';
    }

    return 'other';
  }


  // =========================================
  // レイヤー
  // =========================================

  const layers = {

    nationalTreasure:
      L.layerGroup().addTo(map),

    important:
      L.layerGroup().addTo(map),

    prefecture:
      L.layerGroup().addTo(map),

    city:
      L.layerGroup().addTo(map),

    other:
      L.layerGroup().addTo(map)

  };


  const markerRegistry = [];


  // =========================================
  // マーカー
  // =========================================

  function createMarker(
    feature,
    latlng
  ) {

    const p =
      feature.properties || {};

    const category =
      p['文化財分類'] || '';

    const group =
      getCategoryGroup(category);


    // 国宝 ★
    if (
      group === 'nationalTreasure'
    ) {

      const icon =
        L.divIcon({

          className:
            'special-marker',

          html: `
            <div
              class="special-symbol"
              style="color:#d73027"
            >
              ★
            </div>
          `,

          iconSize:
            [30, 30],

          iconAnchor:
            [15, 15]

        });

      return L.marker(
        latlng,
        { icon }
      );
    }


    // 重要文化財 ◆
    if (
      group === 'important'
    ) {

      const icon =
        L.divIcon({

          className:
            'special-marker',

          html: `
            <div
              class="special-symbol"
              style="color:#f39c12"
            >
              ◆
            </div>
          `,

          iconSize:
            [30, 30],

          iconAnchor:
            [15, 15]

        });

      return L.marker(
        latlng,
        { icon }
      );
    }


    let color =
      '#984ea3';


    if (
      group === 'prefecture'
    ) {
      color =
        '#1a9850';
    }


    if (
      group === 'city'
    ) {
      color =
        '#3388ff';
    }


    return L.circleMarker(
      latlng,
      {
        radius: 8,
        color: '#ffffff',
        weight: 2,
        fillColor: color,
        fillOpacity: 0.9
      }
    );
  }


  // =========================================
  // ポップアップ
  // =========================================

  function buildPopupHtml(feature) {

    const p =
      feature.properties || {};

    const name =
      p.name ||
      '名称不明';

    const category =
      p['文化財分類'] || '';

    const lines = [];


    lines.push(`
      <div class="popup-title">
        ${escapeHtml(name)}
      </div>
    `);


    if (category) {

      lines.push(`
        <div class="popup-row">
          文化財分類：
          ${escapeHtml(category)}
        </div>
      `);

    }


    if (p.address) {

      lines.push(`
        <div class="popup-row">
          住所：
          ${escapeHtml(p.address)}
        </div>
      `);

    }


    if (p.description) {

      lines.push(`
        <div class="popup-row">
          ${escapeHtml(p.description)}
        </div>
      `);

    }


    return lines.join('');
  }


  // =========================================
  // GeoJSON
  // =========================================

  fetch('./mapdata.geojson')

    .then(response => {

      if (!response.ok) {

        throw new Error(
          'GeoJSONの読み込みに失敗しました'
        );

      }

      return response.json();

    })

    .then(data => {

      const bounds = [];


      data.features.forEach(
        feature => {

          if (
            !feature.geometry ||
            feature.geometry.type !== 'Point'
          ) {
            return;
          }


          const [lon, lat] =
            feature.geometry.coordinates;


          const latlng =
            L.latLng(
              lat,
              lon
            );


          markerRegistry.push({
            feature,
            latlng
          });


          bounds.push(
            latlng
          );

        }
      );


      refreshMarkers();


      if (
        bounds.length > 0
      ) {

        map.fitBounds(
          bounds,
          {
            padding:
              [30, 30]
          }
        );

      }

    })

    .catch(error => {

      console.error(error);

      alert(
        '文化財データを読み込めませんでした。'
      );

    });


  // =========================================
  // マーカー再描画
  // =========================================

  function refreshMarkers() {

    Object
      .values(layers)
      .forEach(layer => {
        layer.clearLayers();
      });


    const keyword =
      document
        .getElementById('nameSearch')
        .value
        .trim()
        .toLowerCase();


    let visibleCount = 0;


    markerRegistry.forEach(
      item => {

        const p =
          item.feature
            .properties || {};


        const name =
          String(
            p.name || ''
          );


        const category =
          p['文化財分類'] || '';


        const group =
          getCategoryGroup(
            category
          );


        // カテゴリ判定
        const checkbox =
          document.querySelector(
            `input[data-layer="${group}"]`
          );


        const categoryVisible =
          checkbox
            ? checkbox.checked
            : true;


        // LIKE検索
        const nameVisible =
          keyword === ''
          ||
          name
            .toLowerCase()
            .includes(keyword);


        if (
          !categoryVisible ||
          !nameVisible
        ) {

          return;

        }


        const marker =
          createMarker(
            item.feature,
            item.latlng
          );


        marker.bindPopup(
          buildPopupHtml(
            item.feature
          )
        );


        marker.addTo(
          layers[group]
        );


        visibleCount++;

      });


    updateSearchInfo(
      keyword,
      visibleCount
    );
  }


  // =========================================
  // 検索
  // =========================================

  document
    .getElementById(
      'nameSearch'
    )
    .addEventListener(
      'input',
      refreshMarkers
    );


  function updateSearchInfo(
    keyword,
    count
  ) {

    const info =
      document.getElementById(
        'searchInfo'
      );


    if (!keyword) {

      info.textContent =
        `現在 ${count} 件表示`;

      return;

    }


    info.textContent =
      `「${keyword}」を含む文化財：${count} 件`;

  }


  // =========================================
  // カテゴリフィルター
  // =========================================

  document
    .querySelectorAll(
      'input[data-layer]'
    )
    .forEach(input => {

      input.addEventListener(
        'change',
        refreshMarkers
      );

    });


  // =========================================
  // 全表示
  // =========================================

  document
    .getElementById(
      'showAll'
    )
    .addEventListener(
      'click',
      () => {

        document
          .querySelectorAll(
            'input[data-layer]'
          )
          .forEach(input => {

            input.checked =
              true;

          });


        document
          .getElementById(
            'nameSearch'
          )
          .value = '';


        refreshMarkers();

      }
    );


  // =========================================
  // 国宝・重要文化財のみ
  // =========================================

  document
    .getElementById(
      'showMajor'
    )
    .addEventListener(
      'click',
      () => {

        document
          .querySelectorAll(
            'input[data-layer]'
          )
          .forEach(input => {

            const name =
              input.dataset.layer;


            input.checked =
              (
                name ===
                'nationalTreasure'
                ||
                name ===
                'important'
              );

          });


        refreshMarkers();

      }
    );


  // =========================================
  // スマホメニュー
  // =========================================

  const sidebar =
    document.getElementById(
      'sidebar'
    );


  const menuButton =
    document.getElementById(
      'menuButton'
    );


  const sidebarOverlay =
    document.getElementById(
      'sidebarOverlay'
    );


  function openSidebar() {

    sidebar
      .classList
      .add('open');


    sidebarOverlay
      .classList
      .add('show');


    menuButton.textContent =
      '×';

  }


  function closeSidebar() {

    sidebar
      .classList
      .remove('open');


    sidebarOverlay
      .classList
      .remove('show');


    menuButton.textContent =
      '☰';

  }


  menuButton
    .addEventListener(
      'click',
      () => {

        if (
          sidebar
            .classList
            .contains('open')
        ) {

          closeSidebar();

        } else {

          openSidebar();

        }

      }
    );


  sidebarOverlay
    .addEventListener(
      'click',
      closeSidebar
    );


  // =========================================
  // HTMLエスケープ
  // =========================================

  function escapeHtml(value) {

    return String(value)

      .replaceAll(
        '&',
        '&amp;'
      )

      .replaceAll(
        '<',
        '&lt;'
      )

      .replaceAll(
        '>',
        '&gt;'
      )

      .replaceAll(
        '"',
        '&quot;'
      )

      .replaceAll(
        "'",
        '&#039;'
      );
  }

</script>

</body>
</html>

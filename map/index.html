<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>いわくに文化財マップ</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f7f7f7;
    }

    h1 {
      margin: 0;
      padding: 14px 16px;
      font-size: 1.4rem;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    #map {
      height: calc(100vh - 58px);
    }

    .popup-title {
      font-weight: bold;
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .popup-row {
      margin-top: 4px;
    }

    .legend,
    .filter-box {
      background: rgba(255,255,255,0.95);
      padding: 10px 12px;
      border-radius: 6px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.25);
      line-height: 1.7;
      font-size: 0.9rem;
    }

    .legend-title,
    .filter-title {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .legend-item {
      white-space: nowrap;
    }

    .legend-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
      border: 1px solid white;
      box-shadow: 0 0 0 1px #999;
      vertical-align: -1px;
    }

    .legend-symbol {
      display: inline-block;
      width: 18px;
      text-align: center;
      margin-right: 4px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .filter-box label {
      display: block;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-box input {
      margin-right: 6px;
    }

    .special-marker {
      background: transparent;
      border: none;
    }

    .special-symbol {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      line-height: 28px;

      text-shadow:
        -1px -1px 0 #fff,
         1px -1px 0 #fff,
        -1px  1px 0 #fff,
         1px  1px 0 #fff;
    }
  </style>
</head>

<body>

<h1>いわくに文化財マップ</h1>

<div id="map"></div>

<script>

  // --------------------------------------------------
  // 地図
  // --------------------------------------------------

  const map = L.map('map').setView([34.16, 132.22], 11);


  // 国土地理院「淡色地図」
  L.tileLayer(
    'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
    {
      attribution: '地図：国土地理院'
    }
  ).addTo(map);


  // --------------------------------------------------
  // 分類
  // --------------------------------------------------

  function getCategoryGroup(category) {

    category = String(category || '');

    if (category.includes('国宝')) {
      return 'nationalTreasure';

    } else if (category.includes('重要文化財')) {
      return 'important';

    } else if (category.includes('県指定')) {
      return 'prefecture';

    } else if (category.includes('市指定')) {
      return 'city';

    } else {
      return 'other';
    }
  }


  // --------------------------------------------------
  // レイヤー
  // --------------------------------------------------

  const layers = {

    nationalTreasure: L.layerGroup().addTo(map),

    important: L.layerGroup().addTo(map),

    prefecture: L.layerGroup().addTo(map),

    city: L.layerGroup().addTo(map),

    other: L.layerGroup().addTo(map)

  };


  // --------------------------------------------------
  // マーカー作成
  // --------------------------------------------------

  function createMarker(feature, latlng) {

    const p = feature.properties || {};

    const category = p['文化財分類'] || '';

    const group = getCategoryGroup(category);


    // 国宝 ★
    if (group === 'nationalTreasure') {

      const icon = L.divIcon({
        className: 'special-marker',
        html: `
          <div
            class="special-symbol"
            style="color:#d73027"
          >
            ★
          </div>
        `,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });

      return L.marker(latlng, { icon });
    }


    // 重要文化財 ◆
    if (group === 'important') {

      const icon = L.divIcon({
        className: 'special-marker',
        html: `
          <div
            class="special-symbol"
            style="color:#f39c12"
          >
            ◆
          </div>
        `,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });

      return L.marker(latlng, { icon });
    }


    // 県指定
    if (group === 'prefecture') {

      return L.circleMarker(latlng, {
        radius: 8,
        color: '#ffffff',
        weight: 2,
        fillColor: '#1a9850',
        fillOpacity: 0.9
      });
    }


    // 市指定
    if (group === 'city') {

      return L.circleMarker(latlng, {
        radius: 8,
        color: '#ffffff',
        weight: 2,
        fillColor: '#3388ff',
        fillOpacity: 0.9
      });
    }


    // その他
    return L.circleMarker(latlng, {
      radius: 8,
      color: '#ffffff',
      weight: 2,
      fillColor: '#984ea3',
      fillOpacity: 0.9
    });
  }


  // --------------------------------------------------
  // GeoJSON
  // --------------------------------------------------

  fetch('./mapdata.geojson')

    .then(response => {

      if (!response.ok) {
        throw new Error('GeoJSONの読み込みに失敗しました');
      }

      return response.json();
    })

    .then(data => {

      const bounds = [];


      data.features.forEach(feature => {

        if (!feature.geometry) {
          return;
        }

        if (feature.geometry.type !== 'Point') {
          return;
        }

        const [lon, lat] =
          feature.geometry.coordinates;

        const latlng =
          L.latLng(lat, lon);


        const marker =
          createMarker(
            feature,
            latlng
          );


        // ------------------------------
        // ポップアップ
        // ------------------------------

        const p =
          feature.properties || {};

        const name =
          p.name || '名称不明';

        const category =
          p['文化財分類'] || '';


        const lines = [];

        lines.push(
          `<div class="popup-title">${escapeHtml(name)}</div>`
        );


        if (category) {

          lines.push(
            `<div class="popup-row">
              文化財分類：
              ${escapeHtml(category)}
            </div>`
          );

        }


        if (p.address) {

          lines.push(
            `<div class="popup-row">
              住所：
              ${escapeHtml(p.address)}
            </div>`
          );

        }


        if (p.description) {

          lines.push(
            `<div class="popup-row">
              ${escapeHtml(p.description)}
            </div>`
          );

        }


        marker.bindPopup(
          lines.join('')
        );


        // ------------------------------
        // 分類レイヤーへ追加
        // ------------------------------

        const group =
          getCategoryGroup(category);

        marker.addTo(
          layers[group]
        );


        bounds.push(latlng);

      });


      // 全文化財を表示
      if (bounds.length > 0) {

        map.fitBounds(
          bounds,
          {
            padding: [30, 30]
          }
        );

      }

    })

    .catch(error => {

      console.error(error);

      alert(
        '文化財データを読み込めませんでした。'
      );

    });


  // --------------------------------------------------
  // フィルター
  // --------------------------------------------------

  const filterControl =
    L.control({
      position: 'topright'
    });


  filterControl.onAdd = function() {

    const div =
      L.DomUtil.create(
        'div',
        'filter-box'
      );


    div.innerHTML = `

      <div class="filter-title">
        表示する文化財
      </div>

      <label>
        <input
          type="checkbox"
          data-layer="nationalTreasure"
          checked
        >
        ★ 国宝
      </label>

      <label>
        <input
          type="checkbox"
          data-layer="important"
          checked
        >
        ◆ 重要文化財
      </label>

      <label>
        <input
          type="checkbox"
          data-layer="prefecture"
          checked
        >
        ● 県指定
      </label>

      <label>
        <input
          type="checkbox"
          data-layer="city"
          checked
        >
        ● 市指定
      </label>

      <label>
        <input
          type="checkbox"
          data-layer="other"
          checked
        >
        ● その他
      </label>

    `;


    // 地図操作へのイベント伝播を止める
    L.DomEvent.disableClickPropagation(div);

    L.DomEvent.disableScrollPropagation(div);


    // チェックボックス
    div
      .querySelectorAll('input[type="checkbox"]')
      .forEach(input => {

        input.addEventListener(
          'change',
          event => {

            const layerName =
              event.target.dataset.layer;

            const layer =
              layers[layerName];


            if (event.target.checked) {

              map.addLayer(layer);

            } else {

              map.removeLayer(layer);

            }

          }
        );

      });


    return div;
  };


  filterControl.addTo(map);


  // --------------------------------------------------
  // 凡例
  // --------------------------------------------------

  const legend =
    L.control({
      position: 'bottomright'
    });


  legend.onAdd = function() {

    const div =
      L.DomUtil.create(
        'div',
        'legend'
      );


    div.innerHTML = `

      <div class="legend-title">
        文化財分類
      </div>

      <div class="legend-item">
        <span
          class="legend-symbol"
          style="color:#d73027"
        >
          ★
        </span>
        国宝
      </div>

      <div class="legend-item">
        <span
          class="legend-symbol"
          style="color:#f39c12"
        >
          ◆
        </span>
        重要文化財
      </div>

      <div class="legend-item">
        <span
          class="legend-dot"
          style="background:#1a9850"
        ></span>
        県指定
      </div>

      <div class="legend-item">
        <span
          class="legend-dot"
          style="background:#3388ff"
        ></span>
        市指定
      </div>

      <div class="legend-item">
        <span
          class="legend-dot"
          style="background:#984ea3"
        ></span>
        その他
      </div>

    `;


    return div;
  };


  legend.addTo(map);


  // --------------------------------------------------
  // HTMLエスケープ
  // --------------------------------------------------

  function escapeHtml(value) {

    return String(value)

      .replaceAll(
        '&',
        '&amp;'
      )

      .replaceAll(
        '<',
        '&lt;'
      )

      .replaceAll(
        '>',
        '&gt;'
      )

      .replaceAll(
        '"',
        '&quot;'
      )

      .replaceAll(
        "'",
        '&#039;'
      );

  }

</script>

</body>
</html>
